<style>
:root{--bone:#F2EFE6;--ink:#0A0A09;--ink-soft:#2A2823;--lime:#B8FF2E;--muted-d:#7A7770}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{background:var(--ink);color:var(--bone);font-family:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.wrap{max-width:560px}
.mark{width:64px;height:64px;border-radius:14px;background:var(--ink-soft);display:grid;place-items:center;margin:0 auto 36px}
.mark svg{width:44px}
.check{width:56px;height:56px;border-radius:50%;background:var(--lime);display:grid;place-items:center;margin:0 auto 32px}
.check svg{width:28px;height:28px;stroke:var(--ink);stroke-width:3;fill:none}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(38px,7vw,64px);line-height:1;letter-spacing:-.04em;margin-bottom:22px}
h1 em{font-style:italic;font-weight:300;color:var(--lime)}
p{font-size:19px;color:var(--muted-d);line-height:1.55;max-width:44ch;margin:0 auto 40px}
.back{display:inline-flex;align-items:center;gap:12px;padding:18px 30px;border-radius:999px;background:var(--lime);color:var(--ink);font-size:16px;font-weight:600;text-decoration:none;transition:transform .15s,background .15s;min-height:56px}
.back:hover{background:#cdff60;transform:translateY(-1px)}
.back::before{content:"←";font-weight:500}
.meta{margin-top:40px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted-d);letter-spacing:.06em}
</style>
